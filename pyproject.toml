[project]
name = "learning-platform"
version = "0.1.0"
description = ""
authors = [
    {name = "Ruslan Nakhmedov",email = "ruslan-nahmedov@mail.ru"}
]
requires-python = "^3.14"
dependencies = [
    "psycopg[binary] (>=3.2,<4.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.4.1,<8.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)"
]
dev = [
    "django (>=6.1.2,<7.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "pillow (>=13.0.0,<14.0.0)"
]
